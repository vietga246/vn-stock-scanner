name: "② Daily Collect — Giá & Dòng tiền (2x/ngày T2-T6)"

# Lịch phiên giao dịch HOSE/HNX:
#   Phiên sáng : 09:00 – 11:30 ICT  (ATC 11:30, PTM đến 11:45)
#   Phiên chiều: 13:00 – 15:00 ICT  (ATC 15:00, PTM đến 15:15)
#
# Workflow chạy 2 lần/ngày:
#   Run 1 — Sau phiên SÁNG : 11:45 ICT = 04:45 UTC  → thu thập mid-day snapshot
#   Run 2 — Sau phiên CHIỀU: 15:20 ICT = 08:20 UTC  → thu thập ATC cuối ngày (chính)

on:
  schedule:
    - cron: "45 4 * * 1-5"   # 11:45 ICT — sau phiên sáng
    - cron: "20 8 * * 1-5"   # 15:20 ICT — sau phiên chiều (ATC + PTM xong)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "🧪 TEST MODE - Chỉ chạy VN30 (30 mã)"
        required: false
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Tạo thư mục
        run: mkdir -p data/db data/exports

      # Xác định đây là phiên sáng hay chiều dựa vào giờ UTC
      # Phiên sáng  : cron 04:45 UTC (11:45 ICT)
      # Phiên chiều : cron 08:20 UTC (15:20 ICT)
      - name: "🕐 Xác định phiên giao dịch"
        id: session
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          TOTAL_MIN=$((HOUR * 60 + MINUTE))
          # 04:45 UTC = 285 phút | 08:20 UTC = 500 phút | ngưỡng 06:30 UTC = 390 phút
          if [ "$TOTAL_MIN" -lt 390 ]; then
            echo "SESSION=morning" >> $GITHUB_OUTPUT
            echo "SESSION_LABEL=phiên sáng (11:45 ICT)" >> $GITHUB_OUTPUT
            echo "🌅 Phiên SÁNG — snapshot sau ATC sáng 11:30 ICT"
          else
            echo "SESSION=afternoon" >> $GITHUB_OUTPUT
            echo "SESSION_LABEL=phiên chiều (15:20 ICT)" >> $GITHUB_OUTPUT
            echo "🌇 Phiên CHIỀU — snapshot sau ATC chiều 15:00 ICT (EOD)"
          fi

      # ── IMPORT: Nạp lại foreign history từ Git (phòng khi cache expire) ──
      - name: "📥 Import foreign history từ CSV (nếu DB mới/cache miss)"
        id: import_foreign
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: |
          if [ -f "data/exports/foreign_history.csv" ]; then
            echo "📂 Tìm thấy foreign_history.csv — import vào DB..."
            python pipeline/exporters/export_foreign_history.py import
          else
            echo "ℹ️  foreign_history.csv chưa có — bỏ qua import (lần chạy đầu tiên)"
          fi
        continue-on-error: true

      # ── STEP 1: Price Board snapshot (ATC) ───────────────────────────────
      - name: "📡 Price Board snapshot (ATC)"
        id: price_board
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode != false && 'true' || 'false' }}
        run: |
          echo "🔧 TEST_MODE=$TEST_MODE"
          python pipeline/collectors/price_board_collector.py
        continue-on-error: true

      - name: Check price_board result
        if: steps.price_board.outcome == 'failure'
        run: echo "PRICE_BOARD_FAILED=true" >> $GITHUB_ENV

      # ── STEP 2: Index prices ──────────────────────────────────────────────
      - name: "📈 Cập nhật giá Index (VNINDEX, VN30, HNX30)"
        id: index_prices
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          DAYS_LOOKBACK: "7"
        run: python pipeline/collectors/index_prices_collector.py
        continue-on-error: true

      - name: Check index_prices result
        if: steps.index_prices.outcome == 'failure'
        run: echo "INDEX_PRICES_FAILED=true" >> $GITHUB_ENV

      # ── STEP 3: Daily OHLCV prices ────────────────────────────────────────
      - name: "💹 Cập nhật giá OHLCV hàng ngày"
        id: prices
        env:
          DB_PATH: data/db/stock.db
          DAYS_LOOKBACK: "7"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode == true && 'true' || 'false' }}
        run: |
          echo "🔧 TEST_MODE=$TEST_MODE"
          python pipeline/collectors/daily_prices.py
        continue-on-error: true

      - name: Check prices result
        if: steps.prices.outcome == 'failure'
        run: echo "PRICES_FAILED=true" >> $GITHUB_ENV

      # ── STEP 4: Foreign & Proprietary trading flow ────────────────────────
      - name: "🌍 Cập nhật giao dịch khối ngoại & tự doanh"
        id: foreign
        env:
          DB_PATH: data/db/stock.db
          DAYS_LOOKBACK: "7"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode == true && 'true' || 'false' }}
          NUM_WORKERS: "6"
        run: |
          echo "🔧 TEST_MODE=$TEST_MODE"
          python pipeline/collectors/daily_foreign_flow.py
        continue-on-error: true

      - name: Check foreign result
        if: steps.foreign.outcome == 'failure'
        run: echo "FOREIGN_FAILED=true" >> $GITHUB_ENV

      # ── STEP 5: Export price board → JSON ────────────────────────────────
      - name: "📤 Export price board → JSON"
        id: export_pb
        if: steps.price_board.outcome == 'success'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/exporters/export_price_board.py
        continue-on-error: true

      # ── STEP 6: Export foreign history → CSV (backup lên Git) ────────────
      # QUAN TRỌNG: Đây là cơ chế bảo vệ chống mất data khi cache expire.
      # foreign_history.csv được commit lên Git → khi DB bị reset,
      # workflow sẽ tự import lại toàn bộ lịch sử foreign_trading.
      - name: "💾 Export foreign history → CSV"
        id: export_foreign
        if: steps.foreign.outcome == 'success'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
          FOREIGN_HISTORY_DAYS: "60"
        run: python pipeline/exporters/export_foreign_history.py export
        continue-on-error: true

      # ── Lưu DB ────────────────────────────────────────────────────────────
      - name: Lưu DB vào cache
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      # ── Commit exports ────────────────────────────────────────────────────
      - name: "📤 Commit price_board.json + foreign_history.csv"
        if: steps.export_pb.outcome == 'success' || steps.export_foreign.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED=false
          if [ -f "data/exports/price_board.json" ]; then
            git add data/exports/price_board.json
            CHANGED=true
          fi
          if [ -f "data/exports/foreign_history.csv" ]; then
            git add data/exports/foreign_history.csv
            CHANGED=true
          fi
          if [ "$CHANGED" = "true" ]; then
            SESSION_LABEL="${{ steps.session.outputs.SESSION_LABEL }}"
            git diff --cached --quiet || git commit -m "chore: collect $SESSION_LABEL $(date +'%Y-%m-%d %H:%M') UTC"
            git push || echo "Nothing to push"
          fi

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          SESSION="${{ steps.session.outputs.SESSION_LABEL }}"
          echo "## ② Daily Collect — $SESSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "### 🧪 TEST MODE (VN30 only)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "$PRICE_BOARD_FAILED" = "true" ]; then
            echo "| 📡 Price Board | ⚠️ FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📡 Price Board | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$INDEX_PRICES_FAILED" = "true" ]; then
            echo "| 📈 Index Prices | ⚠️ FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📈 Index Prices | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PRICES_FAILED" = "true" ]; then
            echo "| 💹 OHLCV Prices | ⚠️ FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 💹 OHLCV Prices | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$FOREIGN_FAILED" = "true" ]; then
            echo "| 🌍 Foreign Flow | ⚠️ FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🌍 Foreign Flow | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 💾 Foreign History CSV | ${{ steps.export_foreign.outcome == 'success' && '✅ OK' || '⚠️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/exports/foreign_history.csv" ]; then
            DAYS=$(tail -n +2 data/exports/foreign_history.csv | cut -d',' -f2 | sort -u | wc -l)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Foreign history:** $DAYS ngày tích lũy" >> $GITHUB_STEP_SUMMARY
            if [ "$DAYS" -ge 30 ]; then
              echo "✅ Đủ 30D — foreign_net_30D chính xác" >> $GITHUB_STEP_SUMMARY
            elif [ "$DAYS" -ge 7 ]; then
              echo "✅ Đủ 7D — foreign_net_7D chính xác | ⏳ Cần thêm $((30-DAYS)) ngày cho 30D" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏳ Cần thêm $((7-DAYS)) ngày cho 7D, $((30-DAYS)) ngày cho 30D" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -f "data/db/stock.db" ]; then
            SIZE=$(du -sh data/db/stock.db | cut -f1)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**DB size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if core collectors failed
        if: steps.prices.outcome == 'failure' && steps.foreign.outcome == 'failure'
        run: |
          echo "❌ Both core collectors failed!"
          exit 1
