name: "② Daily Collect — Giá & Dòng tiền (17:00 ICT T2-T6)"

on:
  schedule:
    - cron: "0 10 * * 1-5"    # 17:00 ICT (UTC+7)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Cập nhật giá OHLCV hàng ngày
        id: prices
        env:
          DB_PATH: data/db/stock.db
          DAYS_LOOKBACK: "7"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data/db
          python pipeline/collectors/daily_prices.py
        continue-on-error: true

      - name: Check prices result
        if: steps.prices.outcome == 'failure'
        run: |
          echo "⚠️ daily_prices.py failed but continuing..."
          echo "PRICES_FAILED=true" >> $GITHUB_ENV

      - name: Cập nhật giao dịch khối ngoại & tự doanh
        id: foreign
        env:
          DB_PATH: data/db/stock.db
          DAYS_LOOKBACK: "7"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python pipeline/collectors/daily_foreign_flow.py
        continue-on-error: true

      - name: Check foreign result
        if: steps.foreign.outcome == 'failure'
        run: |
          echo "⚠️ daily_foreign_flow.py failed"
          echo "FOREIGN_FAILED=true" >> $GITHUB_ENV

      - name: Lưu DB vào cache
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      - name: Summary
        run: |
          echo "## Daily Collect Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$PRICES_FAILED" = "true" ]; then
            echo "- ⚠️ Prices: **FAILED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Prices: **OK**" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$FOREIGN_FAILED" = "true" ]; then
            echo "- ⚠️ Foreign: **FAILED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Foreign: **OK**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if both failed
        if: steps.prices.outcome == 'failure' && steps.foreign.outcome == 'failure'
        run: |
          echo "❌ Both collectors failed!"
          exit 1
