name: "⓪ Backfill Foreign Flow — Tích lũy lịch sử khối ngoại (Manual)"

# Workflow này giải quyết vấn đề: foreign_net_7d == foreign_net_30d
# do DB chỉ có 1 ngày data.
#
# NGUYÊN NHÂN:
#   Trading.price_board() chỉ trả về data REAL-TIME (không có historical API).
#   price_board_snapshot chỉ có data từ ngày workflow bắt đầu chạy.
#   daily_foreign_flow.py đọc snapshot cuối ngày → mỗi ngày 1 row.
#   → Cần chạy "② Daily Collect" đủ 30 ngày để có foreign_net_30d thực.
#
# GIẢI PHÁP:
#   Workflow này chạy lại toàn bộ Daily Collect nhiều lần trong 1 job.
#   Tuy nhiên, price_board_snapshot KHÔNG có data quá khứ → không thể
#   backfill ngày đã qua thực sự. Workflow này chỉ:
#     1. Kiểm tra DB hiện tại có bao nhiêu ngày foreign data
#     2. Chạy lại Daily Collect ngay bây giờ để thêm ngày hiện tại
#     3. Hiển thị tiến độ và ước tính ngày có đủ 7D / 30D
#
# ĐỂ CÓ 30D THỰC SỰ: Cần chờ 30 phiên giao dịch với "② Daily Collect"
# chạy đúng giờ mỗi ngày (15:15 ICT T2-T6).

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Chỉ kiểm tra status, không chạy collect"
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Tạo thư mục
        run: mkdir -p data/db data/exports

      # ── KIỂM TRA TRẠNG THÁI HIỆN TẠI ────────────────────────────────────
      - name: "🔍 Kiểm tra foreign_trading status"
        id: check_status
        env:
          DB_PATH: data/db/stock.db
        run: |
          python3 << 'PYEOF'
          import sqlite3, os, sys
          from datetime import datetime, timedelta

          db_path = os.getenv("DB_PATH", "data/db/stock.db")
          if not os.path.exists(db_path):
              print("❌ DB chưa tồn tại — cần chạy ① Bootstrap trước")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("days_available=0\n")
                  f.write("needs_bootstrap=true\n")
              sys.exit(0)

          conn = sqlite3.connect(db_path)

          # Check foreign_trading table
          try:
              rows = conn.execute("""
                  SELECT
                      COUNT(DISTINCT date) AS days,
                      COUNT(DISTINCT symbol) AS symbols,
                      MIN(date) AS earliest,
                      MAX(date) AS latest,
                      SUM(CASE WHEN net_value < 0 THEN 1 ELSE 0 END) AS sell_days,
                      SUM(CASE WHEN net_value > 0 THEN 1 ELSE 0 END) AS buy_days
                  FROM foreign_trading
              """).fetchone()

              days = rows[0] or 0
              symbols = rows[1] or 0
              earliest = rows[2] or "N/A"
              latest = rows[3] or "N/A"

              print(f"=== foreign_trading STATUS ===")
              print(f"  Ngày có data:  {days} ngày")
              print(f"  Symbols:       {symbols}")
              print(f"  Earliest:      {earliest}")
              print(f"  Latest:        {latest}")

              today = datetime.now()
              # Estimate trading days
              target_7d  = today - timedelta(days=10)   # ~7 phiên
              target_30d = today - timedelta(days=42)   # ~30 phiên

              has_7d  = days >= 7
              has_30d = days >= 30

              print(f"\n  ✅ foreign_net_7D:  {'ĐỦ DATA' if has_7d  else f'THIẾU — cần thêm {7-days} ngày'}")
              print(f"  ✅ foreign_net_30D: {'ĐỦ DATA' if has_30d else f'THIẾU — cần thêm {30-days} ngày'}")

              if not has_7d:
                  eta = today + timedelta(days=(7 - days) * 7 // 5)  # adjust for weekends
                  print(f"\n  📅 Dự kiến có 7D: {eta.strftime('%Y-%m-%d')} (nếu chạy đều mỗi phiên)")
              if not has_30d:
                  eta = today + timedelta(days=(30 - days) * 7 // 5)
                  print(f"  📅 Dự kiến có 30D: {eta.strftime('%Y-%m-%d')} (nếu chạy đều mỗi phiên)")

          except Exception as e:
              print(f"  ⚠️ Chưa có bảng foreign_trading: {e}")
              days = 0

          finally:
              conn.close()

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"days_available={days}\n")
              f.write("needs_bootstrap=false\n")
          PYEOF

      # ── NẾU check_only=true, dừng ở đây ─────────────────────────────────
      - name: "⏭ Check only — dừng nếu check_only=true"
        if: inputs.check_only == true
        run: |
          echo "✅ Check only mode — không chạy collect"
          exit 0

      # ── STEP 1: Price Board snapshot ──────────────────────────────────────
      - name: "📡 Price Board snapshot (ATC)"
        id: price_board
        if: steps.check_status.outputs.needs_bootstrap != 'true'
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: "false"
        run: python pipeline/collectors/price_board_collector.py
        continue-on-error: true

      # ── STEP 2: Aggregate foreign flow từ snapshot ────────────────────────
      - name: "🌍 Aggregate foreign flow → foreign_trading"
        id: foreign
        if: steps.price_board.outcome == 'success'
        env:
          DB_PATH: data/db/stock.db
          DAYS_LOOKBACK: "35"
        run: python pipeline/collectors/daily_foreign_flow.py
        continue-on-error: true

      # ── STEP 3: Kiểm tra lại sau khi collect ─────────────────────────────
      - name: "📊 Status sau khi collect"
        env:
          DB_PATH: data/db/stock.db
        run: |
          python3 << 'PYEOF'
          import sqlite3, os
          conn = sqlite3.connect(os.getenv("DB_PATH", "data/db/stock.db"))
          try:
              rows = conn.execute("""
                  SELECT COUNT(DISTINCT date), MIN(date), MAX(date), COUNT(DISTINCT symbol)
                  FROM foreign_trading
              """).fetchone()
              print(f"✅ foreign_trading: {rows[0]} ngày | {rows[3]} symbols | {rows[1]} → {rows[2]}")

              # Check 7D / 30D availability
              r7 = conn.execute("""
                  SELECT COUNT(DISTINCT date) FROM foreign_trading
                  WHERE date >= date('now', '-7 days')
              """).fetchone()[0]
              r30 = conn.execute("""
                  SELECT COUNT(DISTINCT date) FROM foreign_trading
                  WHERE date >= date('now', '-30 days')
              """).fetchone()[0]
              print(f"  7D window:  {r7}/7 phiên")
              print(f"  30D window: {r30}/30 phiên")
              print(f"\n  {'✅ foreign_net_7D sẵn sàng!' if r7 >= 7 else '⏳ Cần thêm ' + str(7-r7) + ' phiên nữa cho 7D'}")
              print(f"  {'✅ foreign_net_30D sẵn sàng!' if r30 >= 30 else '⏳ Cần thêm ' + str(30-r30) + ' phiên nữa cho 30D'}")
          except Exception as e:
              print(f"Error: {e}")
          finally:
              conn.close()
          PYEOF

      # ── Lưu DB vào cache ──────────────────────────────────────────────────
      - name: Lưu DB vào cache
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## ⓪ Backfill Foreign Flow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Quan trọng" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vì \`Trading.price_board()\` chỉ trả về data **real-time**, không thể backfill lịch sử thực sự." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Để có foreign_net_7D / foreign_net_30D chính xác:**" >> $GITHUB_STEP_SUMMARY
          echo "| Mục tiêu | Điều kiện | Giải pháp |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| foreign_net_7D đúng | 7 phiên giao dịch | Chờ 2 tuần chạy \`② Daily Collect\` |" >> $GITHUB_STEP_SUMMARY
          echo "| foreign_net_30D đúng | 30 phiên giao dịch | Chờ 6-7 tuần chạy \`② Daily Collect\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**② Daily Collect** chạy tự động lúc **15:15 ICT T2-T6** sau mỗi phiên ATC." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ngày data hiện có: **${{ steps.check_status.outputs.days_available }}** phiên" >> $GITHUB_STEP_SUMMARY
