name: "🌍 Daily Foreign & Prop Trading"

on:
  schedule:
    # 10:30 UTC Mon-Fri = 17:30 ICT (sau khi thị trường đóng cửa 30 phút)
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

jobs:
  update-foreign-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "⬇️ Checkout repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r scripts/requirements.txt

      - name: "📂 Restore database cache"
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: "🌍 Fetch foreign & prop trading"
        env:
          DB_PATH: data/stock.db
          DAYS_LOOKBACK: "7"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/foreign_trading.py

      - name: "💾 Commit & push data"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock.db
          git diff --cached --quiet || git commit -m "chore: update foreign trading $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
