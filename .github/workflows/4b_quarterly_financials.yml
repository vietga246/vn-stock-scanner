name: "④b Quarterly Financials — Báo cáo tài chính (CN 01:00 ICT, tuần chẵn)"

# Chạy vào 18:00 UTC Thứ 7 = 01:00 ICT Chủ nhật
# Chỉ thực sự fetch data vào tuần chẵn (kiểm tra trong script)
# → ~2 lần/tháng, khớp với tần suất cập nhật BCTC của vnstock

on:
  schedule:
    - cron: "0 18 * * 6"   # 18:00 UTC Thứ 7 = 01:00 ICT Chủ nhật
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode (chỉ lấy VN30 - 30 mã)"
        type: choice
        options: ["false", "true"]
        default: "false"
      force_run:
        description: "Force run (bỏ qua kiểm tra tuần chẵn/lẻ)"
        type: choice
        options: ["false", "true"]
        default: "false"

jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # ── Kiểm tra tuần chẵn TRƯỚC — tránh tốn CI minutes nếu skip ──────────
      - name: Kiểm tra tuần chẵn/lẻ
        id: week_check
        run: |
          WEEK=$(date +%V | sed 's/^0//')
          FORCE=${{ github.event.inputs.force_run || 'false' }}
          echo "ISO week: $WEEK"
          if [ $((WEEK % 2)) -eq 0 ] || [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Tuần chẵn $WEEK (hoặc force) — sẽ chạy"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️  Tuần lẻ $WEEK — bỏ qua, tiết kiệm CI minutes"
          fi

      # ── Chỉ setup môi trường nếu cần chạy thật ──────────────────────────
      - uses: actions/setup-python@v5
        if: steps.week_check.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cài dependencies
        if: steps.week_check.outputs.should_run == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        if: steps.week_check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Tạo thư mục DB
        if: steps.week_check.outputs.should_run == 'true'
        run: mkdir -p data/db data/exports

      - name: Fetch báo cáo tài chính theo quý (706 symbols × 5 năm)
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python pipeline/collectors/quarterly_financials.py

      - name: Tối ưu DB (VACUUM)
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH: data/db/stock.db
        run: python pipeline/utils/vacuum_db.py

      # ── Chạy lại toàn bộ processing pipeline với data tài chính mới ──────
      - name: Tính lại scoring với tài chính mới nhất
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: |
          python pipeline/processors/technical_indicators.py
          python pipeline/processors/scoring_engine.py
          python pipeline/processors/sector_analysis.py

      - name: Export JSON cho web
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/exporters/export_financials.py

      # ── Lưu DB vào cache CHỈ KHI đã thật sự cập nhật ────────────────────
      - name: Lưu DB vào cache
        if: steps.week_check.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      - name: Commit & push exports
        if: steps.week_check.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/screener.json \
                  data/exports/sectors.json \
                  data/exports/stocks.json
          git diff --cached --quiet || git commit -m "chore: quarterly financials $(date +'%Y-%m-%d') [skip ci]"
          git push
