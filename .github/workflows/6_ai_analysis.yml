name: "⑥ AI Analysis — Phân tích AI (Auto-daily/Manual)"

# ============================================================
# CHẠY KHI:
# 1. Tự động sau ③ Daily Process hoàn thành (EOD T2-T6)
# 2. Manual trigger (workflow_dispatch)
# ============================================================

on:
  workflow_run:
    workflows: ["③ Daily Process — Scoring & Sector (sau Daily Collect)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Chế độ chạy'
        required: true
        default: 'ai'
        type: choice
        options:
          - 'fallback'
          - 'ai'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Chỉ chạy nếu:
    # - workflow_dispatch hoặc schedule: luôn chạy
    # - workflow_run: chỉ khi ③ thành công VÀ là phiên chiều EOD (>= 08:00 UTC = 15:00 ICT)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Khi trigger từ workflow_run: chỉ chạy phiên chiều EOD (>= 08:00 UTC)
      # Phiên sáng (04:45 UTC) bỏ qua — data chưa đầy đủ
      - name: "🕐 Kiểm tra phiên EOD (chỉ cho workflow_run)"
        id: eod_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            TOTAL_MIN=$((HOUR * 60 + MINUTE))
            # >= 08:00 UTC (15:00 ICT) = phiên chiều EOD
            if [ "$TOTAL_MIN" -ge 480 ]; then
              echo "is_eod=true" >> $GITHUB_OUTPUT
              echo "✅ Phiên chiều EOD — chạy AI Analysis"
            else
              echo "is_eod=false" >> $GITHUB_OUTPUT
              echo "⏭️  Phiên sáng — bỏ qua AI Analysis (chỉ chạy EOD)"
            fi
          else
            echo "is_eod=true" >> $GITHUB_OUTPUT
            echo "✅ Manual/Schedule trigger — luôn chạy"
          fi

      - name: Setup Python
        if: steps.eod_check.outputs.is_eod == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: steps.eod_check.outputs.is_eod == 'true'
        run: |
          pip install -r pipeline/requirements.txt
          if [ "${{ inputs.run_mode || 'ai' }}" = "ai" ]; then
            pip install openai anthropic
          fi

      - name: Restore DB from cache
        if: steps.eod_check.outputs.is_eod == 'true'
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: Check DB exists
        if: steps.eod_check.outputs.is_eod == 'true'
        id: check_db
        run: |
          mkdir -p data/db data/exports
          if [ -f "data/db/stock.db" ]; then
            echo "DB_EXISTS=true" >> $GITHUB_OUTPUT
            echo "✅ Database found"
          else
            echo "DB_EXISTS=false" >> $GITHUB_OUTPUT
            echo "❌ Database not found - run Bootstrap first"
          fi

      - name: Run AI Analysis
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ inputs.run_mode || 'ai' }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          TOP_N_STOCKS: "15"
        run: python pipeline/ai_analyst/ai_analyst.py

      - name: Generate Reports
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/ai_analyst/report_generator.py

      - name: List generated files
        if: always()
        run: |
          echo "=== Generated files ==="
          ls -la data/exports/ 2>/dev/null || echo "No exports"

      - name: Commit reports
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/ || true
          git diff --cached --quiet || git commit -m "chore: AI analysis $(date +'%Y-%m-%d')"
          git push || echo "Nothing to push"

      - name: Summary
        if: always()
        run: |
          echo "## AI Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ inputs.run_mode || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "- DB: ${{ steps.check_db.outputs.DB_EXISTS }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/exports/ai_analysis.json" ]; then
            echo "- Status: ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: ⚠️ No output" >> $GITHUB_STEP_SUMMARY
          fi
