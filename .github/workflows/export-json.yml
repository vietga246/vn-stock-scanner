name: Export JSON from Cached DB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-json:
    runs-on: ubuntu-latest

    env:
      DB_PATH: data/stock.db
      OUT_PATH: data/stocks.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 🔹 Restore EXACT cache key
      - name: Restore stock DB cache
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-22562391859

      - name: Verify DB exists
        run: |
          ls -lh data || true
          if [ ! -f data/stock.db ]; then
            echo "❌ Cache miss: stock.db not found"
            exit 1
          else
            echo "✅ stock.db restored successfully"
          fi

      - name: Run export_json.py
        run: python export_json.py

      - name: Show JSON size
        run: du -h data/stocks.json

      - name: Commit JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/stocks.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stocks.json"
            git push
          fi
