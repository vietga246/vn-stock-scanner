name: ⑤ Weekly Warning Status

on:
  # Chạy hàng tuần vào Chủ nhật 6:00 UTC (13:00 VN)
  schedule:
    - cron: '0 6 * * 0'
  
  # Cho phép chạy thủ công
  workflow_dispatch:

env:
  DB_PATH: data/db/stock.db
  EXPORT_DIR: data/exports

jobs:
  collect-warning-status:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml selenium webdriver-manager

      - name: 🌐 Install Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: 🔍 Fetch warning stocks
        run: |
          echo "Starting warning status collection..."
          python pipeline/collectors/weekly_warning_status.py

      - name: 📊 Display results
        run: |
          echo ""
          echo "=========================================="
          echo "📋 WARNING STOCKS SUMMARY"
          echo "=========================================="
          
          if [ -f data/exports/warning_stocks.json ]; then
            echo ""
            echo "File: data/exports/warning_stocks.json"
            echo "Size: $(du -h data/exports/warning_stocks.json | cut -f1)"
            echo ""
            
            # Show summary using Python
            python3 << 'EOF'
          import json

          with open("data/exports/warning_stocks.json") as f:
              data = json.load(f)

          print(f"Generated: {data['generated_at']}")
          print(f"Sources: {', '.join(data['sources'])}")
          print(f"Total: {data['total']} stocks")
          print("")
          print("By Status:")
          for status, info in data.get('summary', {}).items():
              print(f"  {status.upper():12} : {info['count']:3} stocks | Penalty: {info['penalty']:>5} | {info['description']}")
          
          print("")
          print("Stock List:")
          for status, stocks in data.get('stocks', {}).items():
              symbols = [s['symbol'] for s in stocks]
              print(f"  {status.upper()}: {', '.join(symbols)}")
          EOF
          else
            echo "❌ Export file not found!"
            exit 1
          fi

      - name: 💾 Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/exports/warning_stocks.json
          git add data/db/stock.db || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update warning stocks [$(date +'%Y-%m-%d')]"
            git push
            echo "✅ Changes committed and pushed"
          fi

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warning-stocks-${{ github.run_number }}
          path: data/exports/warning_stocks.json
          retention-days: 30
