name: "④a Weekly Symbols — Cập nhật thông tin công ty (CN 08:00 ICT)"

on:
  schedule:
    - cron: "0 1 * * 0"   # 01:00 UTC = 08:00 ICT Chủ nhật
  workflow_dispatch:

jobs:
  update-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Cập nhật thông tin công ty (tên, ngành, sàn, P/E, ROE)
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data/db
          python pipeline/collectors/weekly_symbols.py

      - name: Export dữ liệu web
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/exporters/export_financials.py

      - name: Lưu DB vào cache
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/symbols.json
          git diff --cached --quiet || git commit -m "chore: update symbols $(date +'%Y-%m-%d')"
          git push
