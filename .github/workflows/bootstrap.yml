name: 🗄️ Bootstrap Full History (Manual Only)

on:
  workflow_dispatch:   # Chỉ chạy thủ công 1 lần duy nhất

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 giờ — tải toàn bộ từ năm 2000

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: |
          pip install --no-cache-dir pytz>=2023.3
          pip install --no-cache-dir vnstock==0.3.13
          pip install --no-cache-dir pandas tqdm

      - name: 🗄️ Load full price history (2000 → now)
        env:
          DB_PATH: data/stock.db
          SLEEP_BETWEEN: "1.5"
        run: python scripts/hose.py

      - name: 🏢 Load all symbol overviews
        env:
          DB_PATH: data/stock.db
          SLEEP_BETWEEN: "2.0"
        run: python scripts/symbol.py

      - name: 📤 Export JSON for web
        env:
          DB_PATH: data/stock.db
          EXPORT_DIR: data/exports
        run: python scripts/export_json.py

      - name: 💾 Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          git diff --cached --quiet || git commit -m "chore: bootstrap full history $(date +'%Y-%m-%d')"
          git push
