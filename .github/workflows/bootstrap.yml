name: 🗄️ Bootstrap Full History (Manual Only)

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz
          pip install -r scripts/requirements.txt

      - name: 🗄️ Load full price history (2000 → now)
        env:
          DB_PATH: data/stock.db
          SLEEP_BETWEEN: "3"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/hose.py

      - name: 🏢 Load all symbol overviews
        env:
          DB_PATH: data/stock.db
          SLEEP_BETWEEN: "3"
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/symbol.py

      - name: 📤 Export JSON for web
        env:
          DB_PATH: data/stock.db
          EXPORT_DIR: data/exports
        run: python scripts/export_json.py

      - name: 💾 Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          git diff --cached --quiet || git commit -m "chore: bootstrap full history $(date +'%Y-%m-%d')"
          git push
