name: "③ Daily Process — Scoring & Sector (sau Daily Collect)"

on:
  workflow_run:
    workflows: ["② Daily Collect — Giá & Dòng tiền (15:15 ICT T2-T6)"]
    types: [completed]
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Only run if triggered manually or if collect workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Check DB exists
        id: check_db
        run: |
          if [ -f "data/db/stock.db" ]; then
            echo "DB_EXISTS=true" >> $GITHUB_OUTPUT
            echo "✅ Database found"
            sqlite3 data/db/stock.db "SELECT COUNT(*) as rows FROM stock_prices;" || true
          else
            echo "DB_EXISTS=false" >> $GITHUB_OUTPUT
            echo "❌ Database not found!"
          fi

      - name: Tính chỉ số kỹ thuật (MA, RSI, MACD, Bollinger)
        id: technical
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        env:
          DB_PATH: data/db/stock.db
        run: python pipeline/processors/technical_indicators.py
        continue-on-error: true

      - name: Tính composite score toàn thị trường
        id: scoring
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: |
          mkdir -p data/exports
          python pipeline/processors/scoring_engine.py
        continue-on-error: true

      - name: Phân tích ngành & tạo heatmap data
        id: sector
        if: steps.scoring.outcome == 'success'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/processors/sector_analysis.py
        continue-on-error: true

      - name: Export price history cho biểu đồ
        id: prices
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
          PRICE_DAYS_LIMIT: "30"
        run: python pipeline/exporters/export_prices.py
        continue-on-error: true

      - name: Export summary (VN-Index + Top Movers)
        id: summary_export
        if: steps.check_db.outputs.DB_EXISTS == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/exporters/export_summary.py
        continue-on-error: true

      - name: Lưu DB vào cache
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      - name: Commit JSON exports
        if: steps.scoring.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add exports if they exist
          if [ -f "data/exports/screener.json" ]; then
            git add data/exports/screener.json
          fi
          if [ -f "data/exports/sectors.json" ]; then
            git add data/exports/sectors.json
          fi
          if [ -f "data/exports/prices.json" ]; then
            git add data/exports/prices.json
          fi
          if [ -f "data/exports/summary.json" ]; then
            git add data/exports/summary.json
          fi
          
          # Commit if there are changes
          git diff --cached --quiet || git commit -m "chore: daily scoring $(date +'%Y-%m-%d')"
          git push || echo "Nothing to push"

      - name: Summary
        run: |
          echo "## Daily Process Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_db.outputs.DB_EXISTS }}" = "true" ]; then
            echo "| Database | ✅ Found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Database | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.technical.outcome }}" = "success" ]; then
            echo "| Technical | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Technical | ⚠️ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.scoring.outcome }}" = "success" ]; then
            echo "| Scoring | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Scoring | ⚠️ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.sector.outcome }}" = "success" ]; then
            echo "| Sector | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Sector | ⚠️ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical steps failed
        if: steps.check_db.outputs.DB_EXISTS == 'false' || steps.scoring.outcome == 'failure'
        run: |
          echo "❌ Critical step failed!"
          exit 1
