name: Quarterly Financials Update

on:
  schedule:
    - cron: '0 2 1 */3 *'
  workflow_dispatch:

jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Fetch financial reports
        env:
          DB_PATH: data/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/financials.py

      - name: Vacuum and compress DB
        run: |
          python3 -c "
import sqlite3, os
db = os.getenv('DB_PATH', 'data/stock.db')
conn = sqlite3.connect(db)
size_before = os.path.getsize(db) / 1024 / 1024
conn.execute('VACUUM;')
conn.close()
size_after = os.path.getsize(db) / 1024 / 1024
print('DB size: %.1fMB -> %.1fMB' % (size_before, size_after))
"
        env:
          DB_PATH: data/stock.db

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
