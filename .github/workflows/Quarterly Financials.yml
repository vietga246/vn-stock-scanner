name: Quarterly Financials

on:
  schedule:
    - cron: '0 2 1 */3 *'   # 02:00 UTC ngay 1 moi quy
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - chi lay 3 ma (VCB, FPT, VIC)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - run: mkdir -p data

      - name: Run financials
        env:
          DB_PATH: data/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python scripts/financials.py

      - name: Vacuum DB
        env:
          DB_PATH: data/stock.db
        run: python scripts/vacuum_db.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
