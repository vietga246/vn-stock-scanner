name: Quarterly Financials

on:
  schedule:
    - cron: '0 18 * * 6'   # 01:00 ICT (18:00 UTC) moi Sat -> chay vao Chu Nhat ICT
                            # Check tuan chan trong script, tu dong skip tuan le
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - chi lay 3 ma (VCB, FPT, VIC)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_run:
        description: 'Force run - bo qua check tuan chan/le'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Check ISO week (chi chay tuan chan)
        id: week_check
        run: |
          WEEK=$(date +%V | sed 's/^0//')
          FORCE=${{ github.event.inputs.force_run || 'false' }}
          echo "ISO week: $WEEK"
          if [ $((WEEK % 2)) -eq 0 ] || [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "-> RUN (tuan chan $WEEK hoac force)"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "-> SKIP (tuan le $WEEK)"
          fi

      - uses: actions/setup-python@v5
        if: steps.week_check.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt
        if: steps.week_check.outputs.should_run == 'true'

      - uses: actions/cache@v4
        if: steps.week_check.outputs.should_run == 'true'
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - run: mkdir -p data
        if: steps.week_check.outputs.should_run == 'true'

      - name: Run financials
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH: data/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python scripts/financials.py

      - name: Vacuum DB
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH: data/stock.db
        run: python scripts/vacuum_db.py

      - uses: actions/cache/save@v4
        if: steps.week_check.outputs.should_run == 'true'
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}

      # Export summary.json
      - name: Export summary.json
        if: steps.week_check.outputs.should_run == 'true'
        env:
          DB_PATH:  data/stock.db
          OUT_PATH: data/exports/summary.json
        run: |
          mkdir -p data/exports
          python scripts/export_json.py

      - name: Commit summary.json
        if: steps.week_check.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/summary.json
          git diff --staged --quiet || git commit -m "chore: update summary $(date -u +%Y-%m-%d) [skip ci]"
          git push
