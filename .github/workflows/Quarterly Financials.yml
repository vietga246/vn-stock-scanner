name: "📊 Quarterly Financials Update"

on:
  schedule:
    # 02:00 UTC ngày 1 tháng 1, 4, 7, 10 = đầu mỗi quý
    - cron: "0 2 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: "⬇️ Checkout repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r scripts/requirements.txt

      - name: "📂 Restore database cache"
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: "📊 Fetch financial reports"
        env:
          DB_PATH: data/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/financials.py

      - name: "💾 Commit & push data"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock.db
          git diff --cached --quiet || git commit -m "chore: update financials $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
