name: Reset Financials Cache

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Reset financials_meta
        env:
          DB_PATH: data/stock.db
        run: |
          python3 -c "
import sqlite3, os
db = os.getenv('DB_PATH', 'data/stock.db')
conn = sqlite3.connect(db)
conn.execute('DELETE FROM financials_meta')
conn.commit()
n = conn.execute('SELECT changes()').fetchone()[0]
print('Deleted', n, 'rows from financials_meta')
for t in ['financials_ratio','financials_income','financials_balance','financials_cashflow']:
    try:
        r = conn.execute('SELECT COUNT(*), COUNT(DISTINCT symbol) FROM ' + t).fetchone()
        print(t + ': ' + str(r[0]) + ' rows, ' + str(r[1]) + ' symbols')
    except: pass
conn.close()
"

      - name: Save database cache
        uses: actions/cache/save@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
