name: "④ Weekly Update — Symbols & Tài chính (Chủ nhật)"

on:
  schedule:
    - cron: "0 1 * * 0"       # 08:00 ICT Chủ nhật
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode (chỉ lấy VCB, FPT, VIC)"
        type: choice
        options: ["false", "true"]
        default: "false"
      force_financials:
        description: "Force update tài chính (bỏ qua kiểm tra tuần chẵn)"
        type: choice
        options: ["false", "true"]
        default: "false"

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Khôi phục DB từ cache
        uses: actions/cache@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Cập nhật thông tin công ty (tên, ngành, sàn, P/E, ROE)
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          mkdir -p data/db
          python pipeline/collectors/weekly_symbols.py

      - name: Kiểm tra tuần chẵn (tài chính cập nhật 2 tuần/lần)
        id: week_check
        run: |
          WEEK=$(date +%V | sed 's/^0//')
          FORCE=${{ github.event.inputs.force_financials || 'false' }}
          if [ $((WEEK % 2)) -eq 0 ] || [ "$FORCE" = "true" ]; then
            echo "run_financials=true" >> $GITHUB_OUTPUT
            echo "✅ Tuần chẵn $WEEK — sẽ cập nhật tài chính"
          else
            echo "run_financials=false" >> $GITHUB_OUTPUT
            echo "⏭️  Tuần lẻ $WEEK — bỏ qua tài chính"
          fi

      - name: Cập nhật báo cáo tài chính theo quý
        if: steps.week_check.outputs.run_financials == 'true'
        env:
          DB_PATH: data/db/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python pipeline/collectors/quarterly_financials.py

      - name: Tối ưu DB (VACUUM)
        if: steps.week_check.outputs.run_financials == 'true'
        env:
          DB_PATH: data/db/stock.db
        run: python pipeline/utils/vacuum_db.py

      - name: Chạy lại scoring sau khi có tài chính mới
        if: steps.week_check.outputs.run_financials == 'true'
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: |
          python pipeline/processors/technical_indicators.py
          python pipeline/processors/scoring_engine.py
          python pipeline/processors/sector_analysis.py

      - name: Export dữ liệu web
        env:
          DB_PATH: data/db/stock.db
          EXPORT_DIR: data/exports
        run: python pipeline/exporters/export_financials.py

      - name: Lưu DB vào cache
        uses: actions/cache/save@v4
        with:
          path: data/db/stock.db
          key: stock-db-${{ github.run_id }}

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          git diff --cached --quiet || git commit -m "chore: weekly update $(date +'%Y-%m-%d')"
          git push
