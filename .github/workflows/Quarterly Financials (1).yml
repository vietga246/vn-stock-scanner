name: Quarterly Financials Update

on:
  schedule:
    - cron: '0 2 1 */3 *'
  workflow_dispatch:

jobs:
  update-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch financial reports
        env:
          DB_PATH: data/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/financials.py

      - name: Vacuum DB
        env:
          DB_PATH: data/stock.db
        run: python scripts/vacuum_db.py

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
