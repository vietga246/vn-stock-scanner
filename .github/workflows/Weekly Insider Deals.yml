name: "🕵️ Weekly Insider Deals"

on:
  schedule:
    # 02:00 UTC Chủ nhật = 09:00 ICT Chủ nhật (sau weekly_symbols 1 tiếng)
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  update-insider-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: "⬇️ Checkout repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r scripts/requirements.txt

      - name: "📂 Restore database cache"
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: "🕵️ Fetch insider deals"
        env:
          DB_PATH: data/stock.db
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/insider_deals.py

      - name: "💾 Commit & push data"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock.db
          git diff --cached --quiet || git commit -m "chore: update insider deals $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
