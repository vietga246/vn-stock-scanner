name: Reset Financials Cache

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Reset financials_meta
        env:
          DB_PATH: data/stock.db
        run: python scripts/reset_financials_meta.py

      - name: Save database cache
        uses: actions/cache/save@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
