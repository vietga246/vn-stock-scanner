name: 📈 Daily Price Update (5PM ICT)

on:
  schedule:
    # 10:00 UTC = 17:00 ICT (UTC+7), Thứ 2 - Thứ 6
    - cron: "0 10 * * 1-5"
  workflow_dispatch:   # Cho phép chạy thủ công từ GitHub UI

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 📂 Restore database cache
        uses: actions/cache@v4
        with:
          path: data/stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 🔄 Update daily prices
        env:
          DB_PATH: data/stock.db
          DAYS_LOOKBACK: "7"
          SLEEP_BETWEEN: "1.5"
        run: python scripts/hose_daily.py

      - name: 📤 Export JSON for web
        env:
          DB_PATH: data/stock.db
          EXPORT_DIR: data/exports
        run: python scripts/export_json.py

      - name: 💾 Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          git diff --cached --quiet || git commit -m "chore: update prices $(date +'%Y-%m-%d %H:%M ICT')"
          git push
